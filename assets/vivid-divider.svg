<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 4" width="100%" height="4">
  <defs>
    <linearGradient id="vivid-sweep" x1="-100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF007F" stop-opacity="0"/>
      <stop offset="20%" stop-color="#FF007F"/>
      <stop offset="40%" stop-color="#7F00FF"/>
      <stop offset="60%" stop-color="#00F2FE"/>
      <stop offset="80%" stop-color="#00FF87"/>
      <stop offset="100%" stop-color="#00FF87" stop-opacity="0"/>
      <animate attributeName="x1" from="-100%" to="100%" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="x2" from="0%" to="200%" dur="3s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="3" rx="1.5" fill="url(#vivid-sweep)"/>
</svg>
